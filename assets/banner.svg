<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 48px;
      font-weight: 800;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #E2E8F0;
    }
    .grid-line {
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 1;
    }
    
    /* Animations */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(-10px, 15px); opacity: 0.7; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
    }
    
    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }

    .animated-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 900px 100px;
    }

    .animated-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 200px 250px;
    }

    .floating-card-1 {
      animation: floatCard1 6s ease-in-out infinite;
    }

    .floating-card-2 {
      animation: floatCard2 7s ease-in-out infinite;
    }

    .flowing-line {
      stroke-dasharray: 8 8;
      animation: dashFlow 3s linear infinite;
    }
  </style>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Grid Pattern Background -->
  <g>
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line"/>
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line"/>
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line"/>
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line"/>
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line"/>

    <line x1="150" y1="0" x2="150" y2="360" class="grid-line"/>
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line"/>
    <line x1="450" y1="0" x2="450" y2="360" class="grid-line"/>
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line"/>
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line"/>
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line"/>
    <line x1="1050" y1="0" x2="1050" y2="360" class="grid-line"/>
  </g>

  <!-- Dynamic Animated Background Orbs -->
  <circle cx="950" cy="80" r="140" fill="#6366F1" opacity="0.35" filter="url(#softGlow)" class="animated-orb-1"/>
  <circle cx="1050" cy="240" r="120" fill="#EC4899" opacity="0.25" filter="url(#softGlow)" class="animated-orb-1"/>
  <circle cx="150" cy="280" r="130" fill="#3B82F6" opacity="0.25" filter="url(#softGlow)" class="animated-orb-2"/>

  <!-- Connected Flow Lines (Dynamic Aspect) -->
  <path d="M 800 230 C 880 230, 880 130, 960 130" fill="none" stroke="url(#accentGrad1)" stroke-width="2.5" class="flowing-line"/>
  <path d="M 960 130 C 1020 130, 1020 230, 1080 230" fill="none" stroke="url(#accentGrad2)" stroke-width="2.5" class="flowing-line"/>

  <!-- Dynamic Design Token Floating Cards (Background Graphic Elements) -->
  <g class="floating-card-1" opacity="0.85">
    <rect x="830" y="80" width="160" height="70" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <circle cx="855" cy="115" r="14" fill="#A855F7"/>
    <rect x="880" y="102" width="80" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="880" y="118" width="55" height="6" rx="3" fill="#64748B"/>
  </g>

  <g class="floating-card-2" opacity="0.85">
    <rect x="980" y="180" width="170" height="75" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <rect x="1000" y="200" width="24" height="24" rx="6" fill="#3B82F6"/>
    <rect x="1034" y="204" width="90" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="1034" y="220" width="60" height="6" rx="3" fill="#64748B"/>
  </g>

  <!-- Foreground Main Branding & Typography (Guaranteed Top Layer) -->
  <g transform="translate(80, 0)">
    <!-- Top Decorative Gradient Accent Bar -->
    <rect x="0" y="70" width="120" height="4" rx="2" fill="url(#accentGrad1)"/>

    <!-- Main Title -->
    <text x="0" y="135" class="title">
      Awesome <tspan fill="url(#accentGrad1)">UI Design System</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle">
      Curated Ecosystem of Enterprise SaaS Platforms, Open-Source Libraries &amp; Design Tokens
    </text>

    <!-- Pill Badges inside Banner -->
    <g transform="translate(0, 220)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="150" height="34" rx="17" fill="rgba(99, 102, 241, 0.2)" stroke="#6366F1" stroke-width="1"/>
      <circle cx="18" cy="17" r="5" fill="#6366F1"/>
      <text x="32" y="22" class="badge-text">SaaS Platforms</text>

      <!-- Pill 2 -->
      <rect x="162" y="0" width="175" height="34" rx="17" fill="rgba(168, 85, 247, 0.2)" stroke="#A855F7" stroke-width="1"/>
      <circle cx="180" cy="17" r="5" fill="#A855F7"/>
      <text x="194" y="22" class="badge-text">Open-Source Repos</text>

      <!-- Pill 3 -->
      <rect x="349" y="0" width="160" height="34" rx="17" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1"/>
      <circle cx="367" cy="17" r="5" fill="#10B981"/>
      <text x="381" y="22" class="badge-text">Design Tokens</text>
    </g>
  </g>
</svg>
